# Local Postgres + pgvector for Prompt5/Prompt9 e2e tests (and optional dev).
# Usage: docker compose up -d
# Then set DATABASE_URL=postgresql://chatvault:chatvault@127.0.0.1:5433/chatvault_test
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatvault
      POSTGRES_PASSWORD: chatvault
      POSTGRES_DB: chatvault_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatvault -d chatvault_test"]
      interval: 3s
      timeout: 5s
      retries: 10
