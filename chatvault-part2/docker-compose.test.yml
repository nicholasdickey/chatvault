# Local PostgreSQL + pgvector for Jest e2e tests (Prompt5).
# Requires Docker: `docker compose -f docker-compose.test.yml up -d`
# Default URL: postgresql://postgres:postgres@127.0.0.1:5433/chatvault_test
services:
  postgres-test:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatvault_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatvault_test"]
      interval: 3s
      timeout: 5s
      retries: 10
